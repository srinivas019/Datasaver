{% extends "base.html" %}

{% block title %}
Add User
{% endblock %}

{% block content %}

<h2>Add New User</h2>

{% if message %}
<p class="form-message">{{ message }}</p>
{% endif %}

<form action="/register" method="post">

    <label for="name">Name</label><br>
    <input type="text" id="name" name="name" placeholder="Enter your name" required><br><br>

    <label for="rollno">Roll Number</label><br>
    <input type="number" id="rollno" name="rollno" placeholder="Enter roll number" required><br><br>

    <label for="email">Email</label><br>
    <input type="email" id="email" name="email" placeholder="Enter email" required><br><br>

    <label for="phone">Phone Number</label><br>
    <input type="text" id="phone" name="phone" placeholder="Enter phone number" required><br><br>

    <label>Password</label><br>
    <input type="password" name="password" placeholder="Enter phone password" required><br><br>

    <div class="button-group">
        <button type="submit">Registered</button>

        <a href="/">
            <button type="button">Cancel</button>
        </a>
    </div>

</form>

{% endblock %}
